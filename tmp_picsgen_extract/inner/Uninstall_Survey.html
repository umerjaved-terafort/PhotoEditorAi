<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 1 };
  }
  renderVals() {
    const list = ['Feature not working', 'Too many ads', 'I don’t need it', 'Other'];
    const rowBase = 'min-height: 46px; padding: 0 2px; border: 0; background: transparent; display: flex; align-items: center; gap: 14px; text-align: left; font-size: 15px; ';
    const radioBase = 'width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; ';
    return {
      reasons: list.map((label, i) => {
        const selected = this.state.picked === i;
        return {
          label, selected,
          checked: selected ? 'true' : 'false',
          rowStyle: rowBase + (selected ? 'font-weight: 700; color: #7B2FF7;' : 'font-weight: 600; color: #17131F;'),
          radioStyle: radioBase + (selected ? 'border: 2px solid #7B2FF7;' : 'border: 2px solid #B9B0CA;'),
          pick: () => this.setState({ picked: i })
        };
      })
    };
  }
}
</script>
